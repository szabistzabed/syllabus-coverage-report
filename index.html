<!DOCTYPE html>
<html>
<head>
  <title>My Form</title>
</head>
<body>

  <form id="myForm">
    <input type="text" name="name" placeholder="Your Name" required>
    <input type="email" name="email" placeholder="Your Email" required>
    <button type="submit" id="submitBtn">Submit</button>
  </form>

  <script>
    // Apni Web App ka URL yahan dalein
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz_5chVXJAAlAGCaV0bdoh1wlROJHJ9DdhycPcHjsvVq7CiNnhwmBr9ZRR6k1jqTaM/exec;
    const form = document.getElementById('myForm');

    form.addEventListener('submit', e => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Submitting...';

      fetch(scriptURL, { 
        method: 'POST', 
        body: new FormData(form)
      })
      .then(response => {
        alert('Form successfully submit ho gaya!');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit';
        form.reset();
      })
      .catch(error => {
        console.error('Error!', error.message);
        alert('Submit karne me error aaya!');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Submit';
      });
    });
  </script>

</body>
</html>
