<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SZABIST ZAB-ed - Syllabus Coverage Tracker</title>
  <style>
    :root {
      --primary: #0f2a4a;
      --secondary: #1e4f8a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 10px;
    }

    .form-card {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(15, 42, 74, 0.1);
      border: 1px solid #e2e8f0;
      overflow: hidden;
    }

    .brand-header {
      background: linear-gradient(135deg, #0a1c33 0%, #0f2a4a 100%);
      color: #ffffff;
      padding: 24px;
      text-align: center;
      border-bottom: 4px solid #3b82f6;
    }

    .logo-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #ffffff;
      padding: 8px 18px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .logo-text-bold { font-size: 24px; font-weight: 900; color: #0f2a4a; }
    .logo-tag { font-size: 18px; font-weight: 700; color: #1e4f8a; border-left: 2px solid #0f2a4a; padding-left: 8px; }
    .brand-subtitle { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #cbd5e1; margin-top: 4px; font-weight: 600; }
    .form-title { font-size: 18px; font-weight: 600; margin-top: 10px; color: #93c5fd; }

    .form-body { padding: 25px; }
    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #475569;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      color: var(--text);
      background-color: #f8fafc;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .row { display: flex; gap: 12px; }
    .col { flex: 1; }

    .subject-block {
      background: #f1f5f9;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .subject-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 8px;
      border-bottom: 2px solid #cbd5e1;
    }

    .block-number-tag {
      background: #0f2a4a;
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 13px;
    }

    .btn-delete-block {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-delete-block:hover { background: #f87171; color: white; }

    .chapter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }

    .chap-btn {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 8px 4px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .chap-btn:hover { background: #cbd5e1; }
    .chap-btn.active { background: #1e4f8a; color: #ffffff; border-color: #0f2a4a; }

    .btn-custom-chap {
      grid-column: span 2;
      background: #dbeafe;
      color: #1e4f8a;
      border-color: #bfdbfe;
    }

    .chapters-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 10px;
    }

    .chapter-card {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-left: 5px solid #1e4f8a;
      border-radius: 8px;
      padding: 10px 14px;
    }

    .card-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #f1f5f9;
    }

    .card-title-text { font-weight: 800; color: #0f2a4a; font-size: 13px; }

    .btn-remove {
      background: #fee2e2;
      color: #991b1b;
      border: none;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-add-subject {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .btn-add-subject:hover { background: #1d4ed8; }

    button[type="submit"] {
      background: linear-gradient(135deg, #0f2a4a 0%, #1e4f8a 100%);
      color: white;
      border: none;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(15, 42, 74, 0.25);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 42, 74, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      background: #ffffff;
      padding: 30px 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }

    .modal-icon {
      width: 60px;
      height: 60px;
      background: #dcfce7;
      color: #166534;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      margin: 0 auto 16px auto;
    }

    .modal-title { margin: 0 0 8px 0; color: #0f2a4a; font-size: 22px; font-weight: 800; }
    .modal-message { color: #475569; font-size: 14px; margin: 0 0 20px 0; line-height: 1.5; }
    .modal-btn { background: #0f2a4a; color: #ffffff; border: none; padding: 10px 28px; font-size: 14px; font-weight: 700; border-radius: 8px; cursor: pointer; }

    @media (max-width: 600px) { .row { flex-direction: column; gap: 0; } }
  </style>
</head>
<body>

<div class="form-card">
  <div class="brand-header">
    <div class="logo-box">
      <span class="logo-text-bold">SZABIST</span>
      <span class="logo-tag">ZAB-ed</span>
    </div>
    <div class="brand-subtitle">DIRECTORATE OF SCHOOLS & COLLEGES</div>
    <div class="form-title">Syllabus Coverage Tracker</div>
  </div>

  <form id="coverageForm" class="form-body" onsubmit="handleFormSubmit(this)">
    <div class="form-group">
      <label for="schoolName">School / Unit Name</label>
      <select id="schoolName" name="schoolName" required>
        <option value="">-- Select School --</option>
        <option value="SZABIST Junior School Larkana">SZABIST Junior School Larkana</option>
        <option value="SZABIST Junior School Mirpurkhas">SZABIST Junior School Mirpurkhas</option>
        <option value="SZABIST Junior School Hyderabad">SZABIST Junior School Hyderabad</option>
        <option value="SZABIST College Larkana">SZABIST College Larkana</option>
        <option value="Bakhtawar School And College Noudero, Larkana">Bakhtawar School And College Noudero, Larkana</option>
      </select>
    </div>

    <div class="form-group">
      <label for="teacherName">Teacher Name</label>
      <input type="text" id="teacherName" name="teacherName" placeholder="Enter teacher full name" required>
    </div>

    <div class="row">
      <div class="col form-group">
        <label for="fromDate">From Date</label>
        <input type="date" id="fromDate" name="fromDate" required>
      </div>
      <div class="col form-group">
        <label for="toDate">To Date</label>
        <input type="date" id="toDate" name="toDate" required>
      </div>
    </div>

    <hr style="border:0; border-top:1px solid #cbd5e1; margin: 20px 0;">

    <div id="subjectBlocksContainer"></div>

    <button type="button" class="btn-add-subject" onclick="addSubjectBlock()">+ Add Another Subject / Class</button>

    <div class="form-group">
      <label for="status">Overall Syllabus Status</label>
      <select id="status" name="status" required>
      <option value="Completed">Completed Till Midterm</option>
      <option value="Behind Schedule">Behind Schedule Till Midterm</option>
      </select>
    </div>

    <div class="form-group">
      <label for="remarks">Remarks / Issues (Optional)</label>
      <textarea id="remarks" name="remarks" rows="2" placeholder="Enter any extra notes..."></textarea>
    </div>

    <button type="submit" id="btnSubmit">Submit Coverage Report</button>
  </form>
</div>

<div id="successModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-icon">✓</div>
    <h2 class="modal-title" id="modalTitle">Thank You!</h2>
    <p class="modal-message" id="modalMessage">Your Syllabus Coverage Report has been submitted successfully.</p>
    <button class="modal-btn" onclick="closeModal()">OK / Close</button>
  </div>
</div>

<script>
  // ⚠️ PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxdzUIg0GG-Ixtu6rb_PMXD-s_Sb4UgZLpCiLLfj5m5OF1sMlzrxDtUa9RuhOnnT4w7/exec';

  var blockCounter = 0;

  var classesList = [
    "Montessori", "Nursery", "Prep", "Grade 1", "Grade 2", "Grade 3", 
    "Grade 4", "Grade 5", "Grade 6", "Grade 7", "Grade 8", 
    "Grade 9 (BISE)", "Grade 9 (AKU-EB)", "Grade 10 (BISE)", "Grade 10 (AKU-EB)", 
    "Grade 11 (BISE)", "Grade 11 (AKU-EB)", "Grade 12 (BISE)", "Grade 12 (AKU-EB)"
  ];

  var subjectsList = [
    "English", "English Literature", "English Language", "Urdu", "Urdu (Salees)", 
    "Sindhi", "Mathematics", "Business Maths", "Science / General Science", 
    "Physics", "Chemistry", "Biology", "Botany", "Zoology", 
    "Computer / Computer Science", "Social Studies", "Pakistan Studies", 
    "Islamiat", "Islamiat / Ethics", "Accounting", "Economics", "Banking", 
    "Principles of Commerce", "Commercial Geography", "Statistics", "Other"
  ];

  window.onload = function() {
    addSubjectBlock();
  };

  function addSubjectBlock() {
    blockCounter++;
    var blockId = blockCounter;
    var container = document.getElementById('subjectBlocksContainer');

    var block = document.createElement('div');
    block.className = 'subject-block';
    block.id = 'block-' + blockId;
    block.setAttribute('data-block-id', blockId);

    var classOptionsHTML = '<option value="">-- Select Class --</option>' + 
      classesList.map(c => '<option value="' + c + '">' + c + '</option>').join('');

    var subjectOptionsHTML = '<option value="">-- Select Subject --</option>' + 
      subjectsList.map(s => '<option value="' + s + '">' + s + '</option>').join('');

    var blockHTML = 
      '<div class="subject-block-header">' +
        '<span class="block-number-tag">Subject #' + blockId + '</span>' +
        (blockId > 1 ? '<button type="button" class="btn-delete-block" onclick="removeSubjectBlock(' + blockId + ')">Delete Subject ✕</button>' : '') +
      '</div>' +

      '<div class="row">' +
        '<div class="col form-group">' +
          '<label>Class / Grade</label>' +
          '<select class="block-class" required>' + classOptionsHTML + '</select>' +
        '</div>' +
        '<div class="col form-group">' +
          '<label>Subject</label>' +
          '<select class="block-subject" onchange="toggleCustomSubject(this, ' + blockId + ')" required>' + subjectOptionsHTML + '</select>' +
        '</div>' +
      '</div>' +

      '<div class="form-group" id="custom-sub-group-' + blockId + '" style="display:none;">' +
        '<label>Custom Subject Name</label>' +
        '<input type="text" class="block-custom-subject" placeholder="Enter custom subject">' +
      '</div>' +

      '<div class="form-group">' +
        '<label>Select Covered Chapter Numbers (Click to Add)</label>' +
        '<div class="chapter-grid" id="chap-grid-' + blockId + '"></div>' +
      '</div>' +

      '<div class="form-group">' +
        '<label>Selected Chapters, Names & Specific Topics Covered</label>' +
        '<div class="chapters-container" id="chap-cards-container-' + blockId + '"></div>' +
      '</div>' +

      '<div class="row">' +
        '<div class="col form-group">' +
          '<label>Total Planned Chapters</label>' +
          '<input type="number" class="block-total-chaps" min="1" placeholder="e.g. 5" required>' +
        '</div>' +
        '<div class="col form-group">' +
          '<label>Completed Chapters</label>' +
          '<input type="number" class="block-completed-chaps" min="0" placeholder="e.g. 4" required>' +
        '</div>' +
      '</div>';

    block.innerHTML = blockHTML;
    container.appendChild(block);

    var grid = document.getElementById('chap-grid-' + blockId);
    for (var i = 1; i <= 20; i++) {
      var chapBtn = document.createElement('button');
      chapBtn.type = 'button';
      chapBtn.className = 'chap-btn';
      chapBtn.innerText = 'Chap ' + i;
      chapBtn.setAttribute('data-chap', 'Chapter ' + i);
      chapBtn.onclick = (function(bId, title, btn) {
        return function() { toggleBlockChapter(bId, title, btn, false); };
      })(blockId, 'Chapter ' + i, chapBtn);
      grid.appendChild(chapBtn);
    }

    var customChapBtn = document.createElement('button');
    customChapBtn.type = 'button';
    customChapBtn.className = 'chap-btn btn-custom-chap';
    customChapBtn.innerText = '+ Custom Chapter';
    customChapBtn.onclick = function() { addBlockChapterCard(blockId, 'Custom Chapter', true); };
    grid.appendChild(customChapBtn);
  }

  function removeSubjectBlock(blockId) {
    var block = document.getElementById('block-' + blockId);
    if (block) block.remove();
  }

  function toggleCustomSubject(selectEl, blockId) {
    var customGroup = document.getElementById('custom-sub-group-' + blockId);
    var customInput = customGroup.querySelector('.block-custom-subject');
    if (selectEl.value === 'Other') {
      customGroup.style.display = 'block';
      customInput.required = true;
    } else {
      customGroup.style.display = 'none';
      customInput.required = false;
      customInput.value = '';
    }
  }

  function toggleBlockChapter(blockId, chapTitle, btnElement, isCustom) {
    var cardId = 'card-' + blockId + '-' + chapTitle.replace(/\s+/g, '-');
    var existingCard = document.getElementById(cardId);

    if (existingCard) {
      existingCard.remove();
      btnElement.classList.remove('active');
    } else {
      addBlockChapterCard(blockId, chapTitle, isCustom);
      btnElement.classList.add('active');
    }
  }

  function addBlockChapterCard(blockId, chapTitle, isCustom) {
    var container = document.getElementById('chap-cards-container-' + blockId);
    var cardId = 'card-' + blockId + '-' + (isCustom ? 'custom-' + Date.now() : chapTitle.replace(/\s+/g, '-'));

    var card = document.createElement('div');
    card.className = 'chapter-card';
    card.id = cardId;

    var headerHTML = '<div class="card-header-bar">';
    if (isCustom) {
      headerHTML += '<input type="text" class="card-chap-title-input" placeholder="e.g. Extra Unit / Revision" style="width:70%; font-weight:bold;" required>';
    } else {
      headerHTML += '<span class="card-title-text">' + chapTitle + '</span>';
    }
    headerHTML += '<button type="button" class="btn-remove" onclick="removeCardDirect(\'' + cardId + '\', \'' + blockId + '\', \'' + chapTitle + '\')">Remove ✕</button></div>';

    var bodyHTML = '<div class="row">' +
      '<div class="col form-group" style="margin-bottom:6px;">' +
        '<label style="font-size:11px;">Chapter Name</label>' +
        '<input type="text" class="card-chap-name" placeholder="e.g. Quadratic Equations" required>' +
      '</div>' +
      '<div class="col form-group" style="margin-bottom:6px;">' +
        '<label style="font-size:11px;">Specific Topics Covered</label>' +
        '<input type="text" class="card-chap-topics" placeholder="e.g. Factoring, Quadratic Formula" required>' +
      '</div>' +
    '</div>';

    card.innerHTML = headerHTML + bodyHTML;
    container.appendChild(card);
  }

  function removeCardDirect(cardId, blockId, chapTitle) {
    var card = document.getElementById(cardId);
    if (card) card.remove();

    var buttons = document.querySelectorAll('#chap-grid-' + blockId + ' .chap-btn');
    buttons.forEach(function(b) {
      if (b.getAttribute('data-chap') === chapTitle) {
        b.classList.remove('active');
      }
    });
  }

  function showModal(title, message) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = message;
    document.getElementById('successModal').classList.add('active');
  }

  function closeModal() {
    document.getElementById('successModal').classList.remove('active');
  }

  function handleFormSubmit(formObject) {
    event.preventDefault();

    var blocks = document.querySelectorAll('.subject-block');
    if (blocks.length === 0) {
      alert('Kam az kam ek Subject Block add karein!');
      return;
    }

    var entries = [];
    var hasError = false;

    blocks.forEach(function(block) {
      var blockId = block.getAttribute('data-block-id');
      var className = block.querySelector('.block-class').value;
      var subjectVal = block.querySelector('.block-subject').value;

      if (subjectVal === 'Other') {
        subjectVal = 'Other: ' + block.querySelector('.block-custom-subject').value;
      }

      var cards = block.querySelectorAll('.chapter-card');
      if (cards.length === 0) {
        alert('Subject #' + blockId + ' ke liye kam az kam 1 Chapter select karein!');
        hasError = true;
        return;
      }

      var chapDetailsArr = [];
      cards.forEach(function(card) {
        var chapTitleText = '';
        var customInput = card.querySelector('.card-chap-title-input');
        if (customInput) {
          chapTitleText = customInput.value || 'Custom Chapter';
        } else {
          chapTitleText = card.querySelector('.card-title-text').innerText;
        }

        var chapName = card.querySelector('.card-chap-name').value;
        var chapTopics = card.querySelector('.card-chap-topics').value;

        chapDetailsArr.push(chapTitleText + ' ("' + chapName + '") -> Topics: [' + chapTopics + ']');
      });

      entries.push({
        className: className,
        subject: subjectVal,
        chapterDetails: chapDetailsArr.join(' | '),
        totalChapters: block.querySelector('.block-total-chaps').value,
        completedChapters: block.querySelector('.block-completed-chaps').value
      });
    });

    if (hasError) return;

    var formData = {
      schoolName: formObject.schoolName.value,
      teacherName: formObject.teacherName.value,
      fromDate: formObject.fromDate.value,
      toDate: formObject.toDate.value,
      status: formObject.status.value,
      remarks: formObject.remarks.value,
      entries: entries
    };

    var btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerText = 'Submitting Data...';

    // CORS preflight bypass karne ke liye text/plain content type use ho raha hai
    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(formData)
    })
    .then(response => response.json())
    .then(data => {
      btn.disabled = false;
      btn.innerText = 'Submit Coverage Report';
      
      if (data.result === 'success') {
        showModal('Thank You!', 'Your Syllabus Coverage Report has been submitted successfully.');
        document.getElementById('coverageForm').reset();
        document.getElementById('subjectBlocksContainer').innerHTML = '';
        blockCounter = 0;
        addSubjectBlock();
      } else {
        showModal('Error!', 'Submission failed: ' + data.error);
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerText = 'Submit Coverage Report';
      showModal('Error!', 'Network/Submission Error: ' + err);
    });
  }
</script>

</body>
</html>
